<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 17px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { position: relative; aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; }
    .swatch.active { border-color: #1f1b16; }
    .swatch .code { position: absolute; left: 3px; bottom: 3px; font-size: 10px; font-weight: 800; background: rgba(255, 250, 242, .92); color: #282018; border-radius: 4px; padding: 0 4px; }
    .blocks { display: grid; gap: 8px; }
    .blocks button.active { outline: 3px solid #1f1b16; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .chip { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; }
    .budget-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 2px 8px; align-items: center; border-bottom: 1px solid #e1d5c5; padding: 6px 0; font-size: 13px; }
    .budget-row .chip { grid-row: span 2; align-self: center; }
    .budget-row .bname { font-weight: 700; }
    .budget-row .bstock { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; color: #76695e; font-size: 12px; margin: 0; }
    .budget-row .bstock input { width: 64px; padding: 4px 6px; }
    .remain.ok { color: #2f6b3a; font-weight: 700; }
    .remain.warn { color: #b07a1e; font-weight: 700; }
    .remain.bad { color: #a03a2e; font-weight: 800; }
    .replace-info { font-size: 13px; min-height: 18px; margin: 8px 0; }
    .replace-info.ok { color: #2f6b3a; }
    .replace-info.bad { color: #a03a2e; font-weight: 700; }
    #versionBar { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fdf3d8; border: 1px solid #e3c878; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 14px; }
    #versionBar[hidden] { display: none; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    #toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: #282018; color: #fffaf2; padding: 10px 18px; border-radius: 8px; opacity: 0; pointer-events: none; transition: .2s; font-weight: 700; max-width: 80vw; z-index: 10; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: #a03a2e; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>色线按色号管理库存，替换、裁剪与恢复全程保持预算闭环。</div></div>
    <div class="toolbar"><button id="saveBtn">保存方案</button><button id="exportBtn" class="secondary">导出JSON</button></div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <div class="toolbar">
        <button id="resizeBtn">调整网格</button><button id="newBtn" class="secondary">新建空白</button>
      </div>
      <p style="font-size:12px;color:#76695e">调整网格会保留左上角重叠区域；缩小被裁掉的图案可从最近版本恢复。</p>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>色线替换</h2>
      <label>源色号</label><select id="replaceFrom"></select>
      <label>目标色号</label><select id="replaceTo"></select>
      <p class="replace-info" id="replaceInfo"></p>
      <button id="replaceBtn">执行整幅替换</button>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel">
      <div id="versionBar" hidden>
        <span>检测到被裁掉的旧版本（<b id="versionInfo"></b>），图案可找回。</span>
        <button id="restoreBtn" class="secondary">恢复最近版本</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。落笔与替换都受库存约束，不足时整笔拒绝。</p>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>色线库存与预算</h2>
      <div id="budget"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>
  <div id="toast"></div>
  <script src="js/budget.js"></script>
  <script src="js/state.js"></script>
  <script src="js/history.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
