<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦纹样排版台 · 色线预算版</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 15px; margin: 18px 0 8px; }
    h2:first-child { margin-top: 4px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    button:disabled { background: #b9ad9f; cursor: not-allowed; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 300px 1fr 340px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; touch-action: none; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { position: relative; aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; padding: 0; overflow: hidden; }
    .swatch.active { border-color: #1f1b16; }
    .swatch .sw-code, .swatch .sw-free { position: absolute; left: 0; right: 0; background: rgba(31,27,24,.72); color: #fff; font-size: 10px; line-height: 14px; text-align: center; font-weight: 700; }
    .swatch .sw-code { top: 0; }
    .swatch .sw-free { bottom: 0; }
    .swatch .sw-free.low { background: rgba(160,58,46,.92); }
    .blocks { display: grid; gap: 8px; }
    .blocks button.active { outline: 3px solid #d6a437; }
    .stock-row { display: grid; grid-template-columns: 20px 44px 1fr 70px 46px; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #efe6d7; font-size: 13px; }
    .stock-row .chip { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,.15); }
    .stock-row input { padding: 5px 7px; }
    .stock-row .free { text-align: right; font-weight: 800; }
    .stock-row .free.over { color: #a03a2e; }
    .stats { display: grid; gap: 4px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; font-size: 13px; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; background: #f8ead2; }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .warning { color: #a03a2e; font-weight: 800; }
    .ok { color: #355b38; font-weight: 800; }
    #msg { min-height: 22px; margin: 0 0 10px; font-size: 13px; }
    #replaceHint { font-size: 12px; color: #76695e; margin: 6px 0; }
    #replaceMsg { font-size: 12px; min-height: 18px; margin-top: 6px; }
    .trimbar { display: none; margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #f6e7d3; border: 1px solid #d6a437; font-size: 12px; }
    .trimbar.show { display: block; }
    .trimbar button { margin-top: 6px; padding: 6px 10px; font-size: 12px; width: 100%; }
    .budget-head { display: flex; justify-content: space-between; align-items: baseline; font-weight: 800; margin-bottom: 6px; }
    .budget-row { display: grid; grid-template-columns: 20px 1fr auto auto; gap: 8px; align-items: center; font-size: 12px; padding: 4px 0; border-bottom: 1px solid #e1d5c5; }
    .budget-row .chip { width: 16px; height: 16px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
    .budget-row.over { color: #a03a2e; font-weight: 800; }
    .budget-total { margin-top: 6px; font-size: 12px; color: #76695e; }
    .sync { font-size: 12px; color: #76695e; }
    .hist-tip { font-size: 12px; color: #76695e; margin: 6px 0 0; }
    @media (max-width: 1000px) { header { display: block; } .app { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div><h1>手工织锦纹样排版台</h1><div>色号库存 · 整笔替换 · 预算闭环（画布 / 撤销重做 / 统计 / 预览 / 导出一次同步）</div></div>
    <div class="toolbar" style="grid-template-columns: auto auto auto; align-items: center;">
      <span class="sync" id="savedAt">尚未保存</span>
      <button id="saveBtn">保存方案</button>
      <button id="exportBtn" class="secondary">导出JSON</button>
    </div>
  </header>
  <main class="app">
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="resizeBtn" style="width:100%">调整网格（保留重叠区域）</button>
      <div class="trimbar" id="trimBar"></div>
      <h2>色线库（点击选取当前色号）</h2>
      <div class="palette" id="palette"></div>
      <h2>库存维护（按色号，单位：格）</h2>
      <div id="stockList"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary active">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel">
      <p id="msg"></p>
      <div class="grid" id="grid"></div>
      <p class="hist-tip">点击填色，按住拖动连续填色；一笔拖动只记一次历史。库存不足时整笔拒绝并自动还原。</p>
    </section>
    <aside class="panel">
      <h2>色号整笔替换</h2>
      <label>将色号</label>
      <select id="replaceFrom"></select>
      <label>全部替换为</label>
      <select id="replaceTo"></select>
      <p id="replaceHint"></p>
      <button id="replaceBtn" style="width:100%">替换（库存不足则整次拒绝）</button>
      <p id="replaceMsg"></p>
      <h2>操作</h2>
      <div class="toolbar">
        <button id="undoBtn" class="secondary">撤销</button>
        <button id="redoBtn" class="secondary">重做</button>
      </div>
      <p class="hist-tip" id="histTip"></p>
      <h2>渲染预算单</h2>
      <div id="budget"></div>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <script src="js/history.js"></script>
  <script src="js/budget.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
